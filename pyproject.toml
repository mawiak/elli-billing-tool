[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elli-billing-tool"
version = "0.1.0"
description = "Automated charging report generation for company car reimbursement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elli-client>=1.5.0",
    "keyring>=25.0",
    "pywin32-ctypes>=0.2.3; platform_system=='Windows'",
    "PyPDF2",
    "reportlab",
    "tzdata; platform_system=='Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
elli-billing-tool = "elli_billing_tool.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
